name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dev board firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: latest
          target: esp32s3
          command: idf.py build
      - name: Custom PCB firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: latest
          target: esp32s3
          command: idf.py -B build_custom -DSDKCONFIG=sdkconfig.custom -DSDKCONFIG_DEFAULTS=sdkconfig.board_custom -DIDF_TARGET=esp32s3 build
      - name: Package merged images
        run: python3 webflasher/main.py build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp webflasher/firmware/devkit.bin dji-fcc-devkit-${{ github.ref_name }}.bin
          cp webflasher/firmware/custom.bin dji-fcc-custom-pcb-${{ github.ref_name }}.bin
          cp hardware/fab/dji-fcc-gerbers.zip dji-fcc-gerbers-${{ github.ref_name }}.zip
          gh release create "${{ github.ref_name }}" --generate-notes \
            dji-fcc-devkit-${{ github.ref_name }}.bin \
            dji-fcc-custom-pcb-${{ github.ref_name }}.bin \
            dji-fcc-gerbers-${{ github.ref_name }}.zip
